name: Validate Kaikai Experience
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify source integrity and public links
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const page=fs.readFileSync('dist/index.html','utf8');
          const words=JSON.parse(fs.readFileSync('dist/content/scriptures.json','utf8'));
          const library=JSON.parse(fs.readFileSync('dist/content/library.json','utf8'));
          if(!page.includes('id="tutor"')||!page.includes('id="dictionary"')||!page.includes('id="library"'))throw Error('Missing site page');
          if(words.length<1200)throw Error('Missing reference dataset');
          if(library.length!==3||library.some(x=>!x.url.startsWith('https://')))throw Error('Missing book source links');
          if(!fs.existsSync('dist/assets/brand-refresh.css'))throw Error('Missing design asset');
          console.log('Kaikai build verified',words.length,'scripture excerpts');
          NODE
